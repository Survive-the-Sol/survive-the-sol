<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Survive the Sol – Junior Astronaut Mission Trainer</title>
  <meta name="description" content="A kid-friendly 3D game for ages 7–12: survive 12 days on the Moon and Mars, and use the right emergency card when a REAL archived NASA solar storm hits. No weapons, no login.">
  <meta name="theme-color" content="#0b1026">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- Three.js (3D library, MIT licence) loaded from a CDN as an ES module. No build step. -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <!-- Play locally: run "python -m http.server 8000" in this folder, then open http://localhost:8000
       (double-clicking index.html will not work, because the game loads JSON data with fetch()). -->
</head>
<body data-theme="navy">
  <canvas id="game" tabindex="-1" aria-label="3D game view"></canvas>
  <div id="vignette" class="vignette" aria-hidden="true"></div>
  <div id="dustOverlay" class="dust-overlay" aria-hidden="true"></div>

  <!-- ============ GAME HUD (Explore + Storm designs) ============ -->
  <div id="hud" class="hud" hidden>
    <!-- top-left: the 3 core bars -->
    <section class="hud-tl">
      <div class="bars-panel" aria-label="Mission resources">
        <div class="bar" data-bar="power"><span class="bar-ic" data-icon="power"></span>
          <div class="bar-track"><i></i></div><b class="bar-num">0</b>
          <button class="tip" type="button" data-tip="power" aria-label="What is Power?">?</button></div>
        <div class="bar" data-bar="life"><span class="bar-ic" data-icon="life"></span>
          <div class="bar-track"><i></i></div><b class="bar-num">0</b>
          <button class="tip" type="button" data-tip="life" aria-label="What is Life Support?">?</button></div>
        <div class="bar" data-bar="rad"><span class="bar-ic" data-icon="rad"></span>
          <div class="bar-track"><i></i></div><b class="bar-num">0</b>
          <button class="tip" type="button" data-tip="radiation dose" aria-label="What is Radiation Safety?">?</button></div>
        <div class="stamina" aria-label="Stamina"><i></i></div>
      </div>
    </section>

    <!-- top-center: day + storm timer -->
    <section class="hud-tc">
      <div class="day-pill"><span id="dayText">DAY 1 / 12</span><span class="sep"></span><span id="timerLabel">Storm in</span> <b id="timerText">0:45</b></div>
      <div id="earthChip" class="earth-chip" hidden><span data-icon="radio"></span>Earth reply delay: <b>~20 min</b>
        <button class="tip" type="button" data-tip="communication delay" aria-label="What is communication delay?">?</button></div>
    </section>

    <!-- danger banner + USE A CARD prompt (Storm design) -->
    <div id="dangerBanner" class="danger-banner" hidden role="alert"></div>
    <div id="useCard" class="use-card" hidden>USE A CARD! <span id="useCardTime">0:05</span></div>

    <!-- top-right: minimap, or the safe-zone chip during a storm -->
    <section class="hud-tr">
      <div id="minimapWrap" class="minimap"><canvas id="minimap" width="340" height="340" aria-label="Minimap"></canvas></div>
      <div id="zoneChip" class="zone-chip" hidden><span class="dash"></span>Safe zone around base</div>
    </section>

    <!-- bottom-left: ROVI -->
    <section class="hud-bl">
      <div class="rovi-face" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="7" width="16" height="11" rx="4" fill="#1a2150"/><circle class="eye" cx="9.5" cy="12.5" r="1.8" fill="#7cf5c8"/><circle class="eye" cx="14.5" cy="12.5" r="1.8" fill="#7cf5c8"/><path d="M12 7V4" stroke="#1a2150" stroke-width="2"/><circle cx="12" cy="3.5" r="1.4" fill="#e8f22a"/></svg>
      </div>
      <div id="roviBubble" class="rovi-bubble" hidden><span class="rovi-name">ROVI: </span><span id="roviText"></span></div>
    </section>

    <!-- bottom-center: the card hand -->
    <section id="hand" class="hand" aria-label="Your emergency cards"></section>

    <!-- bottom-right: sound + pause -->
    <section class="hud-br">
      <button id="muteBtn" class="sq-btn" type="button" aria-label="Sound on"></button>
      <button id="pauseBtn" class="sq-btn" type="button" aria-label="Pause"><span data-icon="pause"></span></button>
    </section>

    <div id="prompt" class="prompt" hidden></div>
    <div id="popups" class="popups" aria-hidden="true"></div>

    <!-- phone controls (only on touch devices) -->
    <div id="touch" class="touch" hidden>
      <div id="joystick" class="joystick"><div id="knob" class="knob"></div></div>
      <div class="touch-btns">
        <button class="tbtn" data-key="ShiftLeft" type="button">Sprint</button>
        <button class="tbtn" data-key="KeyE" type="button">Rover</button>
        <button class="tbtn big" data-key="Space" type="button">Jump</button>
      </div>
    </div>
  </div>

  <!-- ============ FULL SCREENS (filled by js/screens.js) ============ -->
  <div id="screen" class="screen" hidden></div>

  <div id="loading" class="screen loading">
    <div class="load-box">
      <div class="logo-ring"><svg width="60" height="60" viewBox="0 0 60 60" fill="none" aria-hidden="true"><circle cx="30" cy="30" r="14" fill="#ff8a5c"/><ellipse cx="30" cy="30" rx="26" ry="9" stroke="#7cf5c8" stroke-width="3" transform="rotate(-20 30 30)"/></svg></div>
      <p id="loadText">Loading archived NASA data…</p>
      <div class="load-bar"><i id="loadBar"></i></div>
    </div>
  </div>

  <div id="tipBubble" class="tip-bubble" role="tooltip" hidden></div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
