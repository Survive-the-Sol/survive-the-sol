<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Survive the Sol: Storm Royale</title>
  <meta name="description" content="A kid-friendly 3D survival game for ages 7–12: drop onto the Moon or Mars, collect supplies, drive a rover and reach shelter before a REAL archived NASA solar storm hits. No weapons, no violence.">
  <meta name="theme-color" content="#0b1026">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <!-- Three.js (3D library, MIT licence) loaded from a CDN as an ES module. No build step. -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <!-- To play locally: run "python -m http.server 8000" in this folder, then open http://localhost:8000
       (Double-clicking index.html will NOT work, because the game loads JSON data with fetch().) -->
</head>
<body>
  <canvas id="game" tabindex="-1" aria-label="3D game view"></canvas>
  <div id="vignette" class="vignette" aria-hidden="true"></div>
  <div id="dustOverlay" class="dust-overlay" aria-hidden="true"></div>
  <div id="fade" class="fade" aria-hidden="true"></div>

  <!-- ===================== HUD ===================== -->
  <div id="hud" class="hud" hidden>
    <section class="hud-left">
      <div class="bars panel" aria-label="Mission resources">
        <div class="bar" data-bar="power"><span class="bar-icon" data-icon="power"></span><span class="bar-name">Power</span>
          <button class="tip" type="button" data-tip="power" aria-label="What is Power?">?</button><b class="bar-num">0</b><div class="bar-track"><i></i><em></em></div></div>
        <div class="bar" data-bar="life"><span class="bar-icon" data-icon="life"></span><span class="bar-name">Life Support</span>
          <button class="tip" type="button" data-tip="life" aria-label="What is Life Support?">?</button><b class="bar-num">0</b><div class="bar-track"><i></i><em></em></div></div>
        <div class="bar" data-bar="rad"><span class="bar-icon" data-icon="rad"></span><span class="bar-name">Radiation Safety</span>
          <button class="tip" type="button" data-tip="radiation dose" aria-label="What is radiation dose?">?</button><b class="bar-num">0</b><div class="bar-track"><i></i><em></em></div></div>
        <div class="stamina"><span>Stamina</span><div class="bar-track thin"><i></i></div></div>
        <div id="cardBadge" class="card-badge" hidden></div>
        <div id="buffs" class="buffs"></div>
      </div>
      <div id="commPanel" class="comm panel" hidden>
        <p class="comm-head"><span data-icon="radio"></span> Earth reply delay: <b>~20 min</b>
          <button class="tip" type="button" data-tip="communication delay" aria-label="What is communication delay?">?</button></p>
        <p id="commMsg" class="comm-msg">Waiting for Earth…</p>
      </div>
      <div id="feed" class="feed" aria-live="polite"></div>
    </section>

    <div class="hud-top">
      <div class="compass panel" aria-hidden="true"><div id="compassStrip" class="compass-strip"></div><span class="compass-needle"></span></div>
      <div id="zoneChip" class="zone-chip panel">
        <span id="zoneLabel">Explore</span> <b id="zoneTime">0:00</b>
      </div>
      <div id="flareChip" class="flare-chip" hidden></div>
    </div>

    <section class="hud-right">
      <div class="minimap panel">
        <canvas id="minimap" width="240" height="240" aria-label="Minimap"></canvas>
        <p id="minimapLabel" class="minimap-label">Moon</p>
      </div>
      <div id="leaderboard" class="leaderboard panel" aria-label="Crew race"></div>
    </section>

    <div id="stormBanner" class="storm-banner" hidden role="alert"></div>
    <div id="prompt" class="prompt" hidden></div>
    <div id="quickslots" class="quickslots" aria-label="Quick slots"></div>
    <div id="popups" class="popups" aria-hidden="true"></div>
    <div id="combo" class="combo" hidden></div>

    <div id="rovi" class="rovi" aria-live="polite">
      <div class="rovi-avatar" aria-hidden="true">
        <svg viewBox="0 0 64 64"><line x1="32" y1="6" x2="32" y2="14" stroke="#b4bde3" stroke-width="3" stroke-linecap="round"/>
          <circle cx="32" cy="6" r="4" fill="#e8f22a"/><rect x="10" y="14" width="44" height="34" rx="12" fill="#e9eeff"/>
          <rect x="16" y="21" width="32" height="18" rx="9" fill="#141a3a"/><circle class="eye" cx="25" cy="30" r="4" fill="#7cf5c8"/>
          <circle class="eye" cx="39" cy="30" r="4" fill="#7cf5c8"/><rect x="20" y="50" width="24" height="8" rx="4" fill="#4f7bff"/></svg>
      </div>
      <div id="roviBubble" class="rovi-bubble" hidden><strong>ROVI</strong><p id="roviText"></p></div>
    </div>

    <div class="hud-buttons">
      <button id="bagBtn" class="btn btn-ghost" type="button"><span data-icon="bag"></span><span>Bag</span></button>
      <button id="muteBtn" class="btn btn-ghost btn-icon" type="button" aria-label="Mute sound"></button>
      <button id="pauseBtn" class="btn btn-ghost btn-icon" type="button" aria-label="Pause"><span data-icon="pause"></span></button>
    </div>

    <!-- phone controls -->
    <div id="touch" class="touch" hidden>
      <div id="joystick" class="joystick"><div id="knob" class="knob"></div></div>
      <div class="touch-buttons">
        <button class="tbtn" data-key="KeyE" type="button">Use</button>
        <button class="tbtn" data-key="ShiftLeft" type="button">Sprint</button>
        <button class="tbtn big" data-key="Space" type="button">Jump</button>
        <button class="tbtn" data-key="KeyF" type="button" id="ffBtn" hidden>Skip</button>
      </div>
    </div>
  </div>

  <!-- backpack -->
  <div id="bagScreen" class="bag-screen" hidden>
    <div class="bag-card panel">
      <div class="bag-head"><h2>Backpack</h2><span id="bagLevel" class="pill"></span>
        <button id="bagClose" class="btn btn-ghost" type="button">Close · Tab</button></div>
      <p class="caption">Click an item, then <b>Use</b> or <b>Drop</b>. Click two slots to swap them. Slots 1–4 are quick slots.</p>
      <div id="bagGrid" class="bag-grid"></div>
      <div id="bagDetail" class="bag-detail"></div>
    </div>
  </div>

  <!-- ===================== SCREENS (filled by js/screens.js) ===================== -->
  <div id="screen" class="screen" hidden></div>

  <div id="loading" class="screen loading">
    <div class="loading-card">
      <div class="logo-mark big">
        <img src="assets/logo.png" alt="" onerror="this.remove()">
        <img class="logo-fallback" src="assets/favicon.svg" alt="">
      </div>
      <h1>Survive the Sol <span>Storm Royale</span></h1>
      <p id="loadText">Loading archived NASA data…</p>
      <div class="load-bar"><i id="loadBar"></i></div>
    </div>
  </div>

  <div id="tipBubble" class="tip-bubble" role="tooltip" hidden></div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
