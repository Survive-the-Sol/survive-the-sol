<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Survive the Sol – Pick your cards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#e8f22a}a:hover{color:#f4fa8a}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 0%, #1d2560 0%, #0b1026 60%, #070a1a 100%); font-family: Inter, sans-serif; color: #eef1ff; display: flex; flex-direction: column; align-items: center; padding: 34px 40px; box-sizing: border-box; gap: 18px">
  <div style="display: flex; width: 100%; align-items: center; justify-content: space-between">
    <div style="font-family: Orbitron, sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 2px; color: #8f97c2">DAY 3 / 12 · MOON BASE</div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 12px; background: rgba(255,107,107,0.15); border: 1px solid rgba(255,107,107,0.5); color: #ff9b9b; font-weight: 700">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>
      0:12
    </div>
  </div>
  <h1 style="margin: 0; font-family: Orbitron, sans-serif; font-weight: 800; font-size: 40px; letter-spacing: 1px">PICK 3 EMERGENCY CARDS</h1>
  <p style="margin: 0; font-size: 17px; color: #c5cbe8">These cards can save your crew when danger hits today.</p>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; width: 100%; margin-top: 8px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
      <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.selected}}" style="{{c.boxStyle}}">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <div style="width: 52px; height: 52px; border-radius: 14px; background: #1a2150; display: flex; align-items: center; justify-content: center; color: #7cf5c8">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"/></svg>
          </div>
          <sc-if value="{{c.selected}}" hint-placeholder-val="{{false}}">
            <div style="width: 30px; height: 30px; border-radius: 50%; background: #e8f22a; color: #0b1026; display: flex; align-items: center; justify-content: center">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
            </div>
          </sc-if>
        </div>
        <div style="font-family: Orbitron, sans-serif; font-weight: 700; font-size: 16px; color: #ffffff">{{c.title}}</div>
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #e8f22a">BEST FOR: {{c.danger}}</div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <div style="padding: 6px 10px; border-radius: 8px; background: rgba(124,245,200,0.14); color: #7cf5c8; font-size: 14px; font-weight: 600">+ {{c.good}}</div>
          <div style="padding: 6px 10px; border-radius: 8px; background: rgba(255,107,107,0.14); color: #ff9b9b; font-size: 14px; font-weight: 600">− {{c.cost}}</div>
        </div>
        <div style="border-top: 1px dashed rgba(255,255,255,0.18); padding-top: 10px; font-size: 13px; line-height: 1.45; color: #c5cbe8"><span style="color: #8fb0ff; font-weight: 700">Real science: </span>{{c.science}}</div>
      </button>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; gap: 24px">
    <div style="font-size: 16px; color: #c5cbe8">{{count}} of 3 picked</div>
    <a href="Explore.dc.html" style="width: 300px; height: 60px; border-radius: 16px; background: #e8f22a; color: #0b1026; font-family: Orbitron, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 2px; text-decoration: none; display: flex; align-items: center; justify-content: center">LAND ON MOON</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { picked: ['shield', 'water', 'shelter'] }; }
  renderVals() {
    const all = [
      { id: 'shield', title: 'Radiation Shield', danger: 'SOLAR STORM', good: '70% less radiation', cost: '15 Power', icon: 'M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z', science: 'Thick layers of Moon soil (regolith) can block a lot of radiation.' },
      { id: 'water', title: 'Water Wall', danger: 'SOLAR STORM', good: '50% less radiation', cost: '10 Life Support', icon: 'M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z', science: 'Water is very good at stopping radiation, so bases can keep water in the walls.' },
      { id: 'shelter', title: 'Storm Shelter', danger: 'SOLAR STORM', good: 'Full protection', cost: 'Stuck inside 20s', icon: 'M3 11l9-7 9 7v9H3z M9 20v-6h6v6', science: 'During solar storms, ISS astronauts move to the most shielded parts of the station.' },
      { id: 'oxygen', title: 'Oxygen Boost', danger: 'AIR LEAK', good: 'Saves Life Support', cost: '10 Power', icon: 'M4 12h10a3 3 0 1 0-3-3 M4 16h13a3 3 0 1 1-3 3 M4 8h4', science: 'The ISS makes fresh oxygen by splitting water with electricity.' },
      { id: 'repair', title: 'Quick Repair', danger: 'METEOR HIT', good: 'Fixes damage', cost: 'All stamina', icon: 'M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z', science: 'Astronauts go on spacewalks to repair the outside of the ISS.' }
    ];
    const picked = this.state.picked;
    const cards = all.map((c) => {
      const selected = picked.includes(c.id);
      return Object.assign({}, c, {
        selected: selected,
        boxStyle: 'text-align: left; font-family: Inter, sans-serif; cursor: pointer; padding: 18px; border-radius: 20px; display: flex; flex-direction: column; gap: 12px; color: #eef1ff; min-height: 420px; ' + (selected ? 'background: #18205a; border: 2px solid #e8f22a; box-shadow: 0 0 30px rgba(232,242,42,0.25);' : 'background: rgba(16,22,58,0.8); border: 2px solid rgba(255,255,255,0.1);'),
        pick: () => {
          let p = this.state.picked.slice();
          if (p.includes(c.id)) p = p.filter((x) => x !== c.id);
          else if (p.length < 3) p.push(c.id);
          this.setState({ picked: p });
        }
      });
    });
    return { cards: cards, count: picked.length };
  }
}
</script>
</body>
</html>
