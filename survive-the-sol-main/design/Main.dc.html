<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Survive the Sol – Name page</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#e8f22a}a:hover{color:#f4fa8a}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: radial-gradient(ellipse at 50% 120%, #2a2f4d 0%, #0b1026 55%, #070a1a 100%); font-family: Inter, sans-serif; color: #eef1ff">
  <div style="position: absolute; left: 140px; top: 90px; width: 3px; height: 3px; border-radius: 50%; background: #ffffff; opacity: 0.8"></div>
  <div style="position: absolute; left: 420px; top: 60px; width: 2px; height: 2px; border-radius: 50%; background: #ffffff; opacity: 0.6"></div>
  <div style="position: absolute; left: 980px; top: 120px; width: 3px; height: 3px; border-radius: 50%; background: #ffffff; opacity: 0.7"></div>
  <div style="position: absolute; left: 1150px; top: 300px; width: 2px; height: 2px; border-radius: 50%; background: #ffffff; opacity: 0.6"></div>
  <div style="position: absolute; left: 230px; top: 420px; width: 2px; height: 2px; border-radius: 50%; background: #ffffff; opacity: 0.5"></div>
  <div style="position: absolute; left: 1040px; top: 70px; width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #7fb2ff, #2b5bd6 60%, #10225a)"></div>
  <div style="position: absolute; left: -200px; right: -200px; bottom: -520px; height: 700px; border-radius: 50%; background: radial-gradient(ellipse at 50% 20%, #9a9fb4, #5b6075 60%, #3a3e52)"></div>

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding-bottom: 80px">
    <div style="width: 112px; height: 112px; border-radius: 50%; border: 4px solid #e8f22a; display: flex; align-items: center; justify-content: center; background: #10163a">
      <svg width="60" height="60" viewBox="0 0 60 60" fill="none" aria-hidden="true"><circle cx="30" cy="30" r="14" fill="#ff8a5c"/><ellipse cx="30" cy="30" rx="26" ry="9" stroke="#7cf5c8" stroke-width="3" transform="rotate(-20 30 30)"/></svg>
    </div>
    <div style="font-size: 14px; font-weight: 700; letter-spacing: 3px; color: #e8f22a">NASA SPACE APPS 2026 · JUNIOR ASTRONAUT MISSION TRAINER</div>
    <h1 style="margin: 0; font-family: Orbitron, sans-serif; font-weight: 800; font-size: 64px; letter-spacing: 2px; color: #ffffff">SURVIVE THE SOL</h1>
    <p style="margin: 0; font-size: 20px; color: #c5cbe8">Survive 12 days on the Moon. Use the right card when a real NASA solar storm hits.</p>

    <form style="margin-top: 12px; width: 460px; display: flex; flex-direction: column; gap: 12px; padding: 24px; border-radius: 20px; background: rgba(16,22,58,0.85); border: 1px solid rgba(255,255,255,0.12)">
      <label for="cmdname" style="font-size: 15px; font-weight: 600; color: #c5cbe8">Your commander name</label>
      <div style="display: flex; gap: 10px">
        <input id="cmdname" type="text" placeholder="e.g. Commander Ayesha" style="flex: 1; height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: #0b1026; color: #ffffff; font-size: 17px; font-family: Inter, sans-serif">
        <button type="button" aria-label="Random name" style="width: 52px; height: 52px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: #1a2150; color: #e8f22a; cursor: pointer; display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.2"/><circle cx="16" cy="16" r="1.2"/><circle cx="12" cy="12" r="1.2"/></svg>
        </button>
      </div>
      <a href="Lobby.dc.html" style="margin-top: 6px; height: 58px; border-radius: 14px; background: #e8f22a; color: #0b1026; font-family: Orbitron, sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 2px; text-decoration: none; display: flex; align-items: center; justify-content: center">START</a>
    </form>
    <div style="font-size: 13px; color: #8f97c2">No login needed · Your name stays on this device</div>
  </div>
</div>
</x-dc>
